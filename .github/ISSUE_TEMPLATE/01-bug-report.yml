name: Bug report
description: Something is broken or behaves differently from what you expected.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Report one problem per issue. Give the title a short, specific description, such as "Selected box dimensions disappear after releasing the mouse".
        Fields marked * are required. Plain language is fine; no technical knowledge is needed.
        Check [existing issues](https://github.com/frameinsight/frameinsight-annotator/issues) first. Attach only screenshots or sample files that you can share publicly.
  - type: dropdown
    id: operating-system
    attributes:
      label: Operating system
      options:
        - Windows 11
        - Windows 10
        - Ubuntu
        - Debian
        - Other (name it below)
    validations:
      required: true
  - type: input
    id: os-version
    attributes:
      label: Operating system version
      description: "For example: Windows 11 24H2, Ubuntu 24.04, or Debian 12. Write 'Not sure' if you cannot find it."
      placeholder: Ubuntu 24.04
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: Frameinsight version
      description: Copy the version shown beside LOCAL at the top of the app. If the app cannot open, say so and include the installer version if known.
      placeholder: "3.9.1"
    validations:
      required: true
  - type: dropdown
    id: installation
    attributes:
      label: How did you install or run Frameinsight?
      options:
        - Windows installer (Window_setup.exe)
        - Ubuntu / Debian installer (.deb)
        - Running the source code
        - Other / not sure
    validations:
      required: true
  - type: dropdown
    id: browser
    attributes:
      label: Browser
      description: Choose the browser where you use Frameinsight.
      options:
        - Google Chrome
        - Microsoft Edge
        - Firefox
        - Other (name it in the additional details)
        - The problem happens before a browser opens
        - Not sure
    validations:
      required: true
  - type: textarea
    id: actual-behavior
    attributes:
      label: What is the issue? What actually happens?
      description: Describe the problem you see. Include the exact error message if there is one.
      placeholder: The selected box's dimensions disappear as soon as I release the mouse.
    validations:
      required: true
  - type: textarea
    id: reproduction-steps
    attributes:
      label: How can we reproduce it?
      description: List the steps from opening a video to seeing the problem. Include button names or keyboard shortcuts, and relevant frame numbers, track IDs or classes.
      placeholder: |
        1. Open an existing video.
        2. Go to frame 100 and select Track 2.
        3. Drag the box, then release the mouse.
        4. The dimensions disappear from the bottom of the canvas.
    validations:
      required: true
  - type: textarea
    id: expected-behavior
    attributes:
      label: What should happen instead?
      description: Describe the result you expected after following those steps.
      placeholder: The dimensions should stay visible while the box is selected, even when I am not dragging it.
    validations:
      required: true
  - type: dropdown
    id: frequency
    attributes:
      label: How often does it happen?
      options:
        - Every time I follow these steps
        - Sometimes
        - It happened once; I have not tried again
        - It happened once; I cannot reproduce it again
    validations:
      required: true
  - type: textarea
    id: attachments
    attributes:
      label: Screenshots, recording or sample files (optional)
      description: Drag a screenshot, short recording or small sample annotation file here. Show the problem and any error message. Remove private information before attaching anything.
  - type: textarea
    id: additional-details
    attributes:
      label: Additional details (optional)
      description: "Anything that helps: browser version, video resolution and frame count, import/export format, whether other videos are affected, or whether it started after an update."
  - type: textarea
    id: logs
    attributes:
      label: Error details or logs (optional)
      description: Paste any available error text here. Leave this empty if you do not have it.
      render: text
